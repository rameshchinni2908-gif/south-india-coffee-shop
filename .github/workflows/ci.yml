name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Docker Compose environment files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: Validate Docker Compose
        run: |
          if ! compose_output=$(docker compose config 2>&1); then
            compose_output=${compose_output//'%'/'%25'}
            compose_output=${compose_output//$'\n'/'%0A'}
            compose_output=${compose_output//$'\r'/'%0D'}
            echo "::error title=Docker Compose validation failed::$compose_output"
            exit 1
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-runtime:
    name: Docker runtime and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Docker Compose environment files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: Build and start Docker Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Verify API, web, and MongoDB volume marker
        run: |
          curl --fail --show-error --silent http://127.0.0.1:4000/api/health
          curl --fail --show-error --silent http://127.0.0.1:5173 > /dev/null
          docker compose exec -T mongo mongosh --quiet --eval '
            const checks = db.getSiblingDB("docker_runtime_ci").checks;
            checks.updateOne(
              { _id: "volume-persistence" },
              { $set: { value: "persisted" } },
              { upsert: true },
            );
            if (checks.countDocuments({ _id: "volume-persistence", value: "persisted" }) !== 1) {
              quit(1);
            }
          '

      - name: Restart stack without deleting volumes
        run: |
          docker compose down
          docker compose up --detach --wait --wait-timeout 300

      - name: Verify health and MongoDB persistence after restart
        run: |
          curl --fail --show-error --silent http://127.0.0.1:4000/api/health
          curl --fail --show-error --silent http://127.0.0.1:5173 > /dev/null
          docker compose exec -T mongo mongosh --quiet --eval '
            const checks = db.getSiblingDB("docker_runtime_ci").checks;
            if (checks.countDocuments({ _id: "volume-persistence", value: "persisted" }) !== 1) {
              quit(1);
            }
          '

      - name: Show Docker logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
